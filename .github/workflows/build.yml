name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compute version
        run: |
          V=$(node -p "require('./package.json').version.replace(/\.\d+$/, '.' + process.env.GITHUB_RUN_NUMBER)")
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.LEMON_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lemonlane.keystore"
            echo "LEMON_KEYSTORE=$RUNNER_TEMP/lemonlane.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret set; APK will be debug-signed"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.APP_VERSION }}
          LEMON_KEYSTORE_PASSWORD: ${{ secrets.LEMON_KEYSTORE_PASSWORD }}
          LEMON_KEY_ALIAS: ${{ secrets.LEMON_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/LemonLane.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LemonLane-apk
          path: LemonLane.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          gh release create "$TAG" LemonLane.apk \
            --title "Lemon Lane $TAG" \
            --notes "Android build from ${GITHUB_SHA::7}. Download **LemonLane.apk** on your phone or Fire tablet and open it to install (allow installs from your browser/Files app if asked). Updates install over the old version and keep your saved game." \
            --latest

  pages:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
